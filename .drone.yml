kind: pipeline
type: docker
name: build

clone:
  depth: 0

steps:
  - name: build-and-test
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - apt-get update && apt-get install -y git
      - dotnet tool install -g nbgv
      - export PATH="$PATH:$HOME/.dotnet/tools"
      - dotnet restore HikIsapiClient/hikisapiclient.csproj
      - dotnet build HikIsapiClient/hikisapiclient.csproj --no-restore -c Release
      - echo "Package version will be:"
      - nbgv get-version -p . -f json
      - dotnet test -c Release --logger "trx;LogFileName=test-results.trx"

trigger:
  event:
    - push
  branch:
    exclude:
    - master
    - main

---
kind: pipeline
type: docker
name: publish-nuget

clone:
  depth: 0

steps:
  - name: restore-and-build
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - apt-get update && apt-get install -y git
      - dotnet tool install -g nbgv
      - export PATH="$PATH:$HOME/.dotnet/tools"
      - dotnet restore HikIsapiClient/hikisapiclient.csproj
      - dotnet build HikIsapiClient/hikisapiclient.csproj -c Release --no-restore
      - echo "Building package version:"
      - nbgv get-version -p . -f json

  - name: run-tests
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - dotnet test -c Release --logger "trx;LogFileName=test-results.trx"
    depends_on:
      - restore-and-build

  - name: pack-nuget
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - dotnet pack HikIsapiClient/hikisapiclient.csproj -c Release -o ./nupkgs
      - echo "Created package:"
      - ls -lah ./nupkgs/
    depends_on:
      - run-tests

  - name: publish-nuget
    image: mcr.microsoft.com/dotnet/sdk:10.0
    environment:
      BAGET_URL:
        from_secret: BAGET_URL
    commands:
      - dotnet nuget push ./nupkgs/*.nupkg -s PrivateBaGeta --skip-duplicate
    depends_on:
      - pack-nuget

trigger:
  branch:
    - master
    - main
  event:
    - push
    - custom
